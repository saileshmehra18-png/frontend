<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <title>
            youtube.com
        </title>
        <style>

            p{
                font-family:Roboto,Arial;
                margin-top:0;
                margin-bottom:0;
            }
            .search-bar {
                display: block;
            }
            .thumbnail {
                width: 300px;
                display: block;
            }
            .video-preview {
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 14px;
            }
            .channel-picture {
                display:inline-block;
                width: 36px;
                vertical-align:top;
                background-color: gray;
            }
            .video-info {
                display:inline-block;
                width: 245px;
                background-color: gray;
            }
            .video-title{
                margin-top:0;
                font-size:14px;
                font-weight:500;
                line-height: 20px;
                margin-bottom:12px;
            }
            .profile-picture{
                width:100%;
                border-radius:50px;
            }
            .thumbnail-row{
                margin-bottom:12px;
            }
            .video-author,
            .video-stats{
                font-size:12px;
                color:rgb(96, 96, 96)
            }
            .video-author{
                margin-bottom:4px;
            }
        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="Search">

        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">           
            </div>

            <div>
                <div class = "channel-picture">
                    <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
                </div>

                <div class="video-info">
                    <p class="video-title">           
                    Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>
                    <p class ='video-author'>
                        Marques Brownlee
                    </p>
                    <p class="video-stats">
                        3.4M views &#183; 6 months ago
                    </p>
                </div>       
            </div>
        </div>

        <div class="video-preview">
            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            </div>
            <div >
                <div class="channel-picture">
                    <img class="profile-picture" src ="channel-pictures/channel-2.jpeg">
                </div>
                <div class="video-info">
                    <p class="video-title">   
                        Try Not To Laugh Challenge #9   
                    </p>
                    <p class ='video-author'>
                        Markiplier
                    </p>
                    <p class="video-stats">
                        19M views &#183; 4 years ago
                    </p>
                </div>    
            </div>    
        </div>
    </body>
</html>
<!-- there are three types of elements in html 
 1. block element = it takes the complete line
 2. inlin block element = it takes only as much space as it needs to not the entire line
 3. inline element = it appears within a line of text
 *** we can change each type to other as we did in this project -->

 <!--<div> = it's just a box and boxline type element
    then why it's so usefull??
    cz we can put anything inside a div and make a layout very easily
    div also known as container-->
